name: iOS artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-example-ios:
    name: Build example app (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example-app/package-lock.json

      - name: Install plugin dependencies
        run: npm install --legacy-peer-deps

      - name: Build plugin web layer
        run: npm run build

      - name: Run plugin unit tests
        run: node --test test/

      - name: Install example-app dependencies
        working-directory: example-app
        run: npm install --legacy-peer-deps

      - name: Build example web bundle
        working-directory: example-app
        run: npm run build

      - name: Sync Capacitor iOS platform
        working-directory: example-app
        run: npx cap sync ios

      - name: Build example for iOS Simulator
        working-directory: example-app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            build \
            | tail -40

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'App.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No App.app found in DerivedData" && exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Zip .app
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" "$RUNNER_TEMP/PushAppCapacitorExample.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-example-ios-simulator-app
          path: ${{ runner.temp }}/PushAppCapacitorExample.zip
          retention-days: 30
